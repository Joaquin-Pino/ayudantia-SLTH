# Configuración del experimento SLTH con GA + Tabu Search + NSGA-II
# Strong Lottery Ticket Hypothesis - GA + Tabu Search + NSGA-II Method

# Dataset
dataset:
  name: "bcw"
  path: "data/breast_cancer/breast-cancer-wisconsin.data"
  dedup: false   # decisión pendiente con el profesor
  seed_split: [300]
  train_ratio: 0.0 
  val_ratio: 0.75  
  test_ratio: 0.25

# Arquitecturas base
architectures:
  - [9, 128, 2]                  # R1
  - [9, 256, 128, 2]             # R2
  - [9, 512, 256, 128, 2]        # R3
  - [9, 1024, 512, 256, 128, 2]  # R5

# Sparsity levels (En este caso se explora en un rango de min a max)
sparsities: [0.5]

# Semillas
seed_model: [100]           # una sola red aleatoria compartida (como el paper)
seed_search: [200]
num_replicas: 11            # 11 corridas que solo cambian la semilla de busqueda

# Método
method: "GA_TABU_NSGA2"

# ========================================
# MÉTODO: GUIDED LOCAL SEARCH (GA + Tabu Search + NSGA-II)
# ========================================
GA_TABU_NSGA2:
  # Parámetros del Algoritmo Genético
  pop_size: 50
  max_generations: 375
  mutation_rate: 0.01497
  crossover_rate: 0.78095
  tournament_size: 4
  
  # Rango de sparsity (multiobjetivo)
  min_sparsity: 0.1
  max_sparsity: 0.9
  
  # Parámetros de Tabu Search
  tabu_tenure: 5
  tabu_max_iter: 45
  tabu_max_no_improve: 20
  apply_tabu_every: 5
  
  # Límites globales
  max_evals: 50000

# Salidas
output:
  results_csv: "results/bcw/50k/3-GA_TABU_NSGA2-Base/runs.csv"
  masks_dir:   "results/bcw/50k/3-GA_TABU_NSGA2-Base/best_masks"
  plots_dir:   "results/bcw/50k/3-GA_TABU_NSGA2-Base/plots"
  logs_dir:    "results/bcw/50k/3-GA_TABU_NSGA2-Base/logs"

# Logging
logging:
  verbose: true
  save_traces: true
  plot_convergence: true
  visualize_winner: false
