# Configuración del experimento SLTH con Scatter Search (SS)
# Strong Lottery Ticket Hypothesis - SS Method

# Dataset
dataset:
  name: "wdbc"
  path: "data/breast_cancer/wdbc.data"
  seed_split: [300]
  train_ratio: 0.0 
  val_ratio: 0.5   
  test_ratio: 0.5

# Arquitecturas base
architectures:
  - [30, 128, 2]                  # R1
  - [30, 256, 128, 2]             # R2
  - [30, 512, 256, 128, 2]        # R3

# Sparsity levels
sparsities: [0.1,0.2,0.28,0.3,0.4,0.5]

# Semillas
seed_model: [100]           # una sola red aleatoria compartida (como el paper)
seed_search: [200]
num_replicas: 11            # 11 corridas que solo cambian la semilla de busqueda

# Método
method: "SS"

# Hiperparámetros de Scatter Search
SS:
  refset_size: 10
  refset_quality_ratio: 0.69
  diversification_size: 75
  ts_tenure: 13
  ts_max_iter: 15
  ts_max_no_improve: 25
  max_iter: 100
  max_evals: 50000
  max_no_improve: 5
  min_diversity: null

# Salida
output:
  results_csv: "results/wdbc/50k/2-SS-Base/runs.csv"
  masks_dir:   "results/wdbc/50k/2-SS-Base/best_masks"
  plots_dir:   "results/wdbc/50k/2-SS-Base/plots"
  logs_dir:    "results/wdbc/50k/2-SS-Base/logs"

# Configuración de logging
logging:
  verbose: false
  save_masks: false
  save_traces: true
  plot_convergence: false
