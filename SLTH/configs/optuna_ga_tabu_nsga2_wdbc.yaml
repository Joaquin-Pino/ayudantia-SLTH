# Configuración para optimización de hiperparámetros GA+TABU+NSGA2 con Optuna

# Dataset (mismo protocolo que configs/1k/wdbc/*.yaml)
dataset:
  name: "wdbc"
  path: "data/breast_cancer/wdbc.data"
  seed_split: 300
  train_ratio: 0.0
  val_ratio: 0.5
  test_ratio: 0.5

optimization:
  architectures:
    - [30, 128, 2]              # R1
    - [30, 256, 128, 2]         # R2
    - [30, 512, 256, 128, 2]    # R3
    - [30, 1024, 512, 256, 128, 2]  # R5

  # Número de trials de Optuna
  n_trials: 51

  # Semilla base para reproducibilidad
  seed_base: 42

  # Nombre del estudio
  study_name: "ga_tabu_nsga2_wdbc_optimization"

# Los rangos de búsqueda y los parámetros fijos están en el objective() de cada
# optimizador en src/tune_optuna.py (Tabla 2 del paper); este archivo no los define.
