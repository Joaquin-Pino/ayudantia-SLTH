# Configuración del experimento SLTH con Guided Local Search (GLS)
# Strong Lottery Ticket Hypothesis - GLS Method

# Dataset
dataset:
  name: "bcw"
  path: "data/breast_cancer/breast-cancer-wisconsin.data"
  dedup: false   # decisión pendiente
  seed_split: [300]
  train_ratio: 0.0 
  val_ratio: 0.75  
  test_ratio: 0.25

# Arquitecturas base
architectures:
  - [9, 128, 2]                  # R1
  - [9, 256, 128, 2]             # R2
  - [9, 512, 256, 128, 2]        # R3
  - [9, 1024, 512, 256, 128, 2]  # R5

# Sparsity levels
sparsities: [0.1,0.2,0.28,0.3,0.4,0.5]

# Semillas
seed_model: [100]           # una sola red aleatoria compartida (como el paper)
seed_search: [200]
num_replicas: 11            # 11 corridas que solo cambian la semilla de busqueda

# ========================================
# MÉTODO: GUIDED LOCAL SEARCH (GLS)
# ========================================
method: "GLS"

# Hiperparámetros GLS
GLS:
  alpha: 0.65
  lambda: 0.48
  max_iter: 1600
  max_evals: 10000
  max_no_improve: 150
  ls_max_neighbors: 75

# Baseline
baselines:
  random_mask:
    enabled: true
    num_repetitions: 30
  magnitude_mask:
    enabled: true
    local_search_iterations: 50

# Salida
output:
  results_csv: "results/bcw/10k/1-GLS-Base/runs.csv"
  masks_dir: "results/bcw/10k/1-GLS-Base/best_masks"
  plots_dir: "results/bcw/10k/1-GLS-Base/plots"
  logs_dir: "results/bcw/10k/1-GLS-Base/logs"

# Configuración de logging
logging:
  verbose: false
  save_masks: false
  save_traces: true
  plot_convergence: false