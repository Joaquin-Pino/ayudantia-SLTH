# Configuración del experimento SLTH con Scatter Search (SS)
# Strong Lottery Ticket Hypothesis - SS Method

# Dataset
dataset:
  name: "wine"
  seed_split: [300]
  train_ratio: 0.0 
  val_ratio: 0.75  
  test_ratio: 0.25

# Arquitecturas base
architectures:
  - [13, 128, 3]                  # R1
  - [13, 256, 128, 3]             # R2
  - [13, 512, 256, 128, 3]        # R3
  - [13, 1024, 512, 256, 128, 3]  # R5

# Sparsity levels
sparsities: [0.1,0.2,0.28,0.3,0.4,0.5]

# Semillas
seed_model: [100]
seed_search: [200]
num_replicas: 11

# Método
method: "SS"

# Hiperparámetros de Scatter Search
SS:
  refset_size: 16
  refset_quality_ratio: 0.69
  diversification_size: 80
  ts_tenure: 13
  ts_max_iter: 35
  ts_max_no_improve: 5
  max_iter: 20
  max_evals: 10000
  max_no_improve: 35
  min_diversity: null

# Salida
output:
  results_csv: "results/10k/2-SS-Optuna/runs.csv"
  masks_dir:   "results/10k/2-SS-Optuna/best_masks"
  plots_dir:   "results/10k/2-SS-Optuna/plots"
  logs_dir:    "results/10k/2-SS-Optuna/logs"

# Configuración de logging
logging:
  verbose: false
  save_masks: false
  save_traces: true
  plot_convergence: false
